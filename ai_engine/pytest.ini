[pytest]
# Test discovery is rooted at the tests/ package.
testpaths = tests

# Put the ai_engine project root on sys.path so `import app...` resolves
# regardless of how pytest is launched (`pytest` console script vs
# `python -m pytest`). Requires pytest >= 7.
pythonpath = .

# Concise, readable output by default. Strict markers means a typo in a
# @pytest.mark.<name> raises instead of silently registering a new marker.
addopts = -q --strict-markers

# Test levels (see Chapter 6.1). Run a single layer with: pytest -m unit
markers =
    unit: Fast, isolated tests of pure functions/classes with no I/O.
    integration: Tests that exercise several units against an in-memory SQLite DB.
    api: FastAPI TestClient tests of HTTP endpoints with external deps mocked.
    benchmark: Algorithmic-behavior and latency benchmarks (excluded from the fast run).