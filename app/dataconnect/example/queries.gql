query GetUserByUid($uid: String!) @auth(level: USER) {
  user(key: { uid: $uid }) {
    uid
    email
    fullName
    role
    isActive
    createdAt
  }
}

query GetStudentsByParent($parentUid: String!) @auth(level: USER) {
  students(where: { parent: { uid: { eq: $parentUid } } }) {
    uid
    user {
      fullName
      email
      isActive
      isEmailVerified
    }
    gradeLevel
    totalXp
    totalCoins
  }
}

query GetStudentWithParent($uid: String!) @auth(level: USER) {
  student(key: { uid: $uid }) {
    uid
    parent {
      uid
      user {
        uid
        fullName
        email
      }
    }
  }
}

# ── Installed-app inventory ───────────────────────────────────────────────────

# Returns the full installed-app inventory for a student.
# Called by the parent's app-picker and by the parent's StudentConfigScreen.
query GetInstalledAppsForStudent($studentUid: String!) @auth(level: USER, insecureReason: "The app validates access via custom logic or shared student data.") {
  installedApps(where: { studentUid: { eq: $studentUid } }) {
    id
    packageName
    appLabel
    isSystemApp
    iconBase64
  }
}

# Inserts a single installed-app row.
mutation InsertInstalledApp(
  $studentUid: String!
  $packageName: String!
  $appLabel: String!
  $isSystemApp: Boolean!
  $iconBase64: String
) @auth(level: USER, insecureReason: "Students are authorized to sync their own installed apps list.") {
  installedApp_insert(data: {
    studentUid: $studentUid
    packageName: $packageName
    appLabel: $appLabel
    isSystemApp: $isSystemApp
    iconBase64: $iconBase64
  })
}

# Wipes all installed-app rows for a student before a fresh sync.
mutation DeleteAllInstalledAppsForStudent($studentUid: String!) @auth(level: USER, insecureReason: "Students are authorized to clear their own installed apps list before sync.") {
  installedApp_deleteMany(where: { studentUid: { eq: $studentUid } })
}

# ── App rules ─────────────────────────────────────────────────────────────────

# Fetches the global student config and all app rules for a given student.
# Used by the parent config screen and by the student device to sync rules.
# ── Student Profile ───────────────────────────────────────────────────────────

# Returns profile data for a student, including the friend code and stats.
query GetStudentProfile($uid: String!) @auth(level: USER, insecureReason: "Students are authorized to read their own profile data.") {
  student(key: { uid: $uid }) {
    uid
    friendCode
    totalXp
    totalCoins
    gradeLevel
    totalQuestionsAnswered
    currentStreak
  }
}

# ── Leaderboard ───────────────────────────────────────────────────────────────

# Returns all students sorted by weeklyXp DESC for the global leaderboard.
# Tie-break: totalXp DESC (client sorts alphabetically after that).
query GetWeeklyLeaderboard @auth(level: USER, insecureReason: "Leaderboard is visible to all authenticated students.") {
  students(orderBy: [{ weeklyXp: DESC }, { totalXp: DESC }], limit: 100) {
    uid
    weeklyXp
    totalXp
    lastActiveAt
    user {
      fullName
    }
  }
}

# Looks up a student by their unique friend code.
query GetStudentByFriendCode($friendCode: String!) @auth(level: USER, insecureReason: "Friend code lookup requires knowing the exact code.") {
  students(where: { friendCode: { eq: $friendCode } }, limit: 1) {
    uid
    friendCode
    user {
      fullName
    }
  }
}

# Returns all pending friend requests sent by a student.
query GetSentFriendRequests($fromStudentUid: String!) @auth(level: USER, insecureReason: "Students can view their own sent requests.") {
  friendRequests(
    where: { fromStudentUid: { eq: $fromStudentUid } }
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    toFriendCode
    toStudentName
    status
    createdAt
  }
}

# Returns all accepted friends for a student with profile info.
query GetFriendsForStudent($studentUid: String!) @auth(level: USER, insecureReason: "Students can view their own friends list.") {
  friendships(where: { studentUid: { eq: $studentUid } }) {
    id
    friendUid
    friend {
      uid
      totalXp
      weeklyXp
      lastActiveAt
      user {
        fullName
      }
    }
  }
}

# ── Parent: Friend Request Approval ──────────────────────────────────────────

# Returns all pending friend requests for all students belonging to a parent.
query GetPendingFriendRequestsForParent($parentUid: String!) @auth(level: USER, insecureReason: "Parents are authorized to view their children's pending friend requests.") {
  friendRequests(
    where: {
      fromStudent: { parent: { uid: { eq: $parentUid } } }
      status: { eq: "pending_parent_approval" }
    }
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    toFriendCode
    toStudentName
    toStudentUid
    createdAt
    fromStudentUid
    fromStudent {
      uid
      user {
        fullName
      }
    }
  }
}

# ── Student Settings ──────────────────────────────────────────────────────────

# Returns the app preferences for a student. Null if never saved.
query GetStudentSettings($studentUid: String!) @auth(level: USER, insecureReason: "Students are authorized to read their own settings.") {
  studentSettings(key: { studentUid: $studentUid }) {
    notificationsEnabled
    soundEffectsEnabled
    backgroundMusicEnabled
  }
}

# ── Avatar Shop ───────────────────────────────────────────────────────────────

# Returns all item IDs owned by a student (catalog items are client-side).
query GetStudentOwnedItems($studentUid: String!) @auth(level: USER, insecureReason: "Students read their own inventory.") {
  studentOwnedItems(where: { studentUid: { eq: $studentUid } }) {
    itemId
  }
}

# Returns the student's current avatar configuration.
query GetStudentAvatar($studentUid: String!) @auth(level: USER, insecureReason: "Students read their own avatar config.") {
  studentAvatar(key: { studentUid: $studentUid }) {
    gender
    skinTone
    equippedHair
    equippedOutfit
    equippedBottom
    equippedShoes
    equippedAccessory
    equippedBackground
    equippedSpecial
  }
}

# ── App rules ─────────────────────────────────────────────────────────────────

# Fetches the global student config and all app rules for a given student.
# Used by the parent config screen and by the student device to sync rules.
query GetAppConfigForStudent($studentUid: String!) @auth(level: USER) {
  studentConfig(key: { studentUid: $studentUid }) {
    usageHours
    usageMinutes
    cooldownHours
    cooldownMinutes
  }
  appRules(where: { studentUid: { eq: $studentUid } }) {
    id
    packageName
    appLabel
    iconBase64
  }
}