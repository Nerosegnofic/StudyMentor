query GetUserByUid($uid: String!) @auth(level: USER, insecureReason: "Users look up their own profile or parents look up their children's user records; access scoped by application logic.") {
  user(key: { uid: $uid }) {
    uid
    email
    fullName
    role
    isActive
    createdAt
  }
}

query GetStudentsByParent($parentUid: String!) @auth(level: USER, insecureReason: "Parents fetch their own children; parentUid is validated against the caller's identity at the application layer.") {
  students(where: { parent: { uid: { eq: $parentUid } } }) {
    uid
    user {
      fullName
      email
      isActive
      isEmailVerified
      createdAt
    }
    gradeLevel
    lastActiveAt
  }
}

query GetStudentWithParent($uid: String!) @auth(level: USER, insecureReason: "Used to verify the parent-student relationship; students access their own parent info or parents verify their own children.") {
  student(key: { uid: $uid }) {
    uid
    parent {
      uid
      user {
        uid
        fullName
        email
      }
    }
  }
}

# ── Installed-app inventory ───────────────────────────────────────────────────

query GetInstalledAppsForStudent($studentUid: String!) @auth(level: USER, insecureReason: "The app validates access via custom logic or shared student data.") {
  installedApps(where: { studentUid: { eq: $studentUid } }) {
    id
    packageName
    appLabel
    isSystemApp
  }
}

mutation InsertInstalledApp(
  $studentUid: String!
  $packageName: String!
  $appLabel: String!
  $isSystemApp: Boolean!
) @auth(level: USER, insecureReason: "Students are authorized to sync their own installed apps list.") {
  installedApp_insert(data: {
    studentUid: $studentUid
    packageName: $packageName
    appLabel: $appLabel
    isSystemApp: $isSystemApp
  })
}

mutation DeleteAllInstalledAppsForStudent($studentUid: String!) @auth(level: USER, insecureReason: "Students are authorized to clear their own installed apps list before sync.") {
  installedApp_deleteMany(where: { studentUid: { eq: $studentUid } })
}

# ── Student Settings ──────────────────────────────────────────────────────────

query GetStudentSettings($studentUid: String!) @auth(level: USER, insecureReason: "Students are authorized to read their own settings.") {
  studentSettings(key: { studentUid: $studentUid }) {
    notificationsEnabled
    soundEffectsEnabled
    backgroundMusicEnabled
  }
}

# ── Avatar Shop ───────────────────────────────────────────────────────────────

query GetStudentOwnedItems($studentUid: String!) @auth(level: USER, insecureReason: "Students read their own inventory.") {
  studentOwnedItems(where: { studentUid: { eq: $studentUid } }) {
    itemId
  }
}

query GetStudentAvatar($studentUid: String!) @auth(level: USER, insecureReason: "Students read their own avatar config.") {
  studentAvatar(key: { studentUid: $studentUid }) {
    gender
    skinTone
    equippedHair
    equippedOutfit
    equippedBottom
    equippedShoes
    equippedAccessory
    equippedBackground
    equippedSpecial
    avatarConfig
  }
}

# ── App rules ─────────────────────────────────────────────────────────────────

query GetAppConfigForStudent($studentUid: String!) @auth(level: USER, insecureReason: "Students read their own config; parents read their children's config. Ownership enforced by application logic.") {
  studentConfig(key: { studentUid: $studentUid }) {
    usageHours
    usageMinutes
    cooldownHours
    cooldownMinutes
    quizCount
  }
  appRules(where: { studentUid: { eq: $studentUid } }) {
    id
    packageName
    appLabel
    isPaused
  }
}

# ── Notification System ───────────────────────────────────────────────────────

query GetUnreadLocalNotificationEvents(
  $toParentUid: String!
) @auth(level: USER, insecureReason: "Parent reads their own unread events.") {
  localNotificationEvents(where: {
    toParentUid: { eq: $toParentUid },
    isRead: { eq: false }
  }) {
    id
    fromStudentUid
    eventType
    payload
    createdAt
  }
}

# Used by the 15-min poll to fetch events not yet dispatched as OS notifications.
query GetUndispatchedLocalNotificationEvents(
  $toParentUid: String!
) @auth(level: USER, insecureReason: "Poll service reads undispatched events for the parent.") {
  localNotificationEvents(where: {
    toParentUid: { eq: $toParentUid },
    isDispatched: { eq: false }
  }) {
    id
    fromStudentUid
    eventType
    payload
    createdAt
  }
}

# Fetches all notification events for the parent's in-app notification bell,
# ordered newest first. Includes isRead so the UI can reflect read state.
query GetAllLocalNotificationEventsForParent(
  $toParentUid: String!
) @auth(level: USER, insecureReason: "Parent reads their own notification history.") {
  localNotificationEvents(
    where: { toParentUid: { eq: $toParentUid } }
    orderBy: [{ createdAt: DESC }]
    limit: 50
  ) {
    id
    fromStudentUid
    eventType
    payload
    createdAt
    isRead
  }
}

# Fetches all in-app notification events for the student's notification bell.
query GetStudentNotificationEvents(
  $studentUid: String!
) @auth(level: USER, insecureReason: "Student reads their own notification history.") {
  studentNotificationEvents(
    where: { studentUid: { eq: $studentUid } }
    orderBy: [{ createdAt: DESC }]
    limit: 50
  ) {
    id
    eventType
    title
    body
    createdAt
    isRead
  }
}

query GetLocalNotificationPreferences(
  $userUid: String!
) @auth(level: USER, insecureReason: "Users read their own preferences.") {
  localNotificationPreferences(where: { userUid: { eq: $userUid } }) {
    category
    enabled
    reminderTime
  }
}
