  }
}

# ── Sibling Leaderboard ───────────────────────────────────────────────────────

query GetSiblingLeaderboard($parentUid: String!) @auth(level: USER, insecureReason: "Students can view their siblings' leaderboard.") {
  students(
    where: { parent: { uid: { eq: $parentUid } } }
    orderBy: [{ weeklyXp: DESC }, { totalXp: DESC }]
  ) {
    uid
    username
    weeklyXp
    totalXp
    lastActiveAt
  }
}

# ── Garden System ─────────────────────────────────────────────────────────────

query GetAllSubjectProgress($studentUid: String!) @auth(level: USER, insecureReason: "Student queries their own progress by passing their UID.") {
  subjectProgresses(where: { studentUid: { eq: $studentUid } }) {
    studentUid
    subjectKey
    totalXp
    level
    updatedAt
  }
}
