query GetUserByUid($uid: String!) @auth(level: USER) {
  user(key: { uid: $uid }) {
    uid
    email
    fullName
    role
    isActive
    createdAt
  }
}

query GetStudentsByParent($parentUid: String!) @auth(level: USER) {
  students(where: { parent: { uid: { eq: $parentUid } } }) {
    uid
    user {
      fullName
      email
      isActive
      isEmailVerified
    }
    gradeLevel
    totalXp
    totalCoins
  }
}

query GetStudentWithParent($uid: String!) @auth(level: USER) {
  student(key: { uid: $uid }) {
    uid
    parent {
      uid
      user {
        uid
        fullName
        email
      }
    }
  }
}

# ── Installed-app inventory ───────────────────────────────────────────────────

# Returns the full installed-app inventory for a student.
# Called by the parent's app-picker and by the parent's StudentConfigScreen.
query GetInstalledAppsForStudent($studentUid: String!) @auth(level: USER, insecureReason: "The app validates access via custom logic or shared student data.") {
  installedApps(where: { studentUid: { eq: $studentUid } }) {
    id
    packageName
    appLabel
    isSystemApp
    iconBase64
  }
}

# Inserts a single installed-app row.
mutation InsertInstalledApp(
  $studentUid: String!
  $packageName: String!
  $appLabel: String!
  $isSystemApp: Boolean!
  $iconBase64: String
) @auth(level: USER, insecureReason: "Students are authorized to sync their own installed apps list.") {
  installedApp_insert(data: {
    studentUid: $studentUid
    packageName: $packageName
    appLabel: $appLabel
    isSystemApp: $isSystemApp
    iconBase64: $iconBase64
  })
}

# Wipes all installed-app rows for a student before a fresh sync.
mutation DeleteAllInstalledAppsForStudent($studentUid: String!) @auth(level: USER, insecureReason: "Students are authorized to clear their own installed apps list before sync.") {
  installedApp_deleteMany(where: { studentUid: { eq: $studentUid } })
}

# ── App rules ─────────────────────────────────────────────────────────────────

# Fetches the global student config and all app rules for a given student.
# Used by the parent config screen and by the student device to sync rules.
# ── Student Profile ───────────────────────────────────────────────────────────

# Returns profile data for a student, including the friend code and stats.
query GetStudentProfile($uid: String!) @auth(level: USER, insecureReason: "Students are authorized to read their own profile data.") {
  student(key: { uid: $uid }) {
    uid
    friendCode
    totalXp
    totalCoins
    gradeLevel
  }
}

# ── Student Settings ──────────────────────────────────────────────────────────

# Returns the app preferences for a student. Null if never saved.
query GetStudentSettings($studentUid: String!) @auth(level: USER, insecureReason: "Students are authorized to read their own settings.") {
  studentSettings(key: { studentUid: $studentUid }) {
    notificationsEnabled
    soundEffectsEnabled
    backgroundMusicEnabled
  }
}

# ── App rules ─────────────────────────────────────────────────────────────────

# Fetches the global student config and all app rules for a given student.
# Used by the parent config screen and by the student device to sync rules.
query GetAppConfigForStudent($studentUid: String!) @auth(level: USER) {
  studentConfig(key: { studentUid: $studentUid }) {
    usageHours
    usageMinutes
    cooldownHours
    cooldownMinutes
  }
  appRules(where: { studentUid: { eq: $studentUid } }) {
    id
    packageName
    appLabel
    iconBase64
  }
}