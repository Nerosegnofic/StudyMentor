mutation InsertUser($email: String!, $fullName: String!, $role: Role!) @auth(level: USER) {
  user_insert(
    data: {
      uid_expr: "auth.uid"
      email: $email
      fullName: $fullName
      role: $role
      isActive: true
      isEmailVerified: false
    }
  )
}

mutation UpsertCurrentUser($email: String, $fullName: String, $role: Role!) @auth(level: USER) {
  user_update(
    key: { uid_expr: "auth.uid" }
    data: {
      email: $email
      fullName: $fullName
      role: $role
      isActive: true
      isEmailVerified: true
    }
  )
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: { uid_expr: "auth.uid" })
}

mutation InsertParent($pinCode: String, $phoneNumber: String) @auth(level: USER) {
  parent_insert(
    data: {
      uid_expr: "auth.uid"
      userUid_expr: "auth.uid"
      pinCode: $pinCode
      phoneNumber: $phoneNumber
    }
  )
}

mutation InsertStudent(
  $parentUid: String!
  $username: String!
  $gradeLevel: Int
) @auth(level: USER) {
  student_insert(
    data: {
      uid_expr: "auth.uid"
      userUid_expr: "auth.uid"
      parentUid: $parentUid
      username: $username
      gradeLevel: $gradeLevel
    }
  )
}

mutation SetUserInactive @auth(level: USER) {
  user_update(
    key: { uid_expr: "auth.uid" }
    data: { isActive: false }
  )
}

mutation MarkEmailVerified @auth(level: USER) {
  user_update(
    key: { uid_expr: "auth.uid" }
    data: { isEmailVerified: true }
  )
}

# ── App Rule Mutations ────────────────────────────────────────────────────────

mutation InsertAppRule(
  $studentUid: String!
  $packageName: String!
  $appLabel: String!
  $isPaused: Boolean = false
) @auth(level: USER) {
  appRule_insert(
    data: {
      studentUid: $studentUid
      packageName: $packageName
      appLabel: $appLabel
      isPaused: $isPaused
    }
  )
}

mutation DeleteAllAppRulesForStudent($studentUid: String!) @auth(level: USER) {
  appRule_deleteMany(where: { studentUid: { eq: $studentUid } })
}



# ── Student Settings ──────────────────────────────────────────────────────────

mutation UpsertStudentSettings(
  $studentUid: String!
  $notificationsEnabled: Boolean!
  $soundEffectsEnabled: Boolean!
  $backgroundMusicEnabled: Boolean!
) @auth(level: USER, insecureReason: "Students are authorized to update their own settings.") {
  studentSettings_upsert(
    data: {
      studentUid: $studentUid
      notificationsEnabled: $notificationsEnabled
      soundEffectsEnabled: $soundEffectsEnabled
      backgroundMusicEnabled: $backgroundMusicEnabled
    }
  )
}

# ── Avatar Shop Mutations ─────────────────────────────────────────────────────

mutation InsertStudentOwnedItem(
  $studentUid: String!
  $itemId: String!
) @auth(level: USER, insecureReason: "Students purchase items for themselves.") {
  studentOwnedItem_insert(
    data: {
      studentUid: $studentUid
      itemId: $itemId
    }
  )
}



mutation UpsertStudentAvatar(
  $studentUid: String!
  $gender: String!
  $skinTone: String!
  $equippedHair: String
  $equippedOutfit: String
  $equippedBottom: String
  $equippedShoes: String
  $equippedAccessory: String
  $equippedBackground: String
  $equippedSpecial: String
  $avatarConfig: String
) @auth(level: USER, insecureReason: "Students update their own avatar.") {
  studentAvatar_upsert(
    data: {
      studentUid: $studentUid
      gender: $gender
      skinTone: $skinTone
      equippedHair: $equippedHair
      equippedOutfit: $equippedOutfit
      equippedBottom: $equippedBottom
      equippedShoes: $equippedShoes
      equippedAccessory: $equippedAccessory
      equippedBackground: $equippedBackground
      equippedSpecial: $equippedSpecial
      avatarConfig: $avatarConfig
    }
  )
}



# ── Student Account Deletion (parent-side) ───────────────────────────────────

mutation DeleteAllOwnedItemsForStudent($studentUid: String!) @auth(level: USER, insecureReason: "Parents can delete their children's owned items.") {
  studentOwnedItem_deleteMany(where: { studentUid: { eq: $studentUid } })
}

mutation DeleteStudentAvatar($studentUid: String!) @auth(level: USER, insecureReason: "Parents can delete their children's avatar.") {
  studentAvatar_delete(key: { studentUid: $studentUid })
}

mutation DeleteStudentSettings($studentUid: String!) @auth(level: USER, insecureReason: "Parents can delete their children's settings.") {
  studentSettings_delete(key: { studentUid: $studentUid })
}

mutation DeleteStudentConfig($studentUid: String!) @auth(level: USER, insecureReason: "Parents can delete their children's config.") {
  studentConfig_delete(key: { studentUid: $studentUid })
}

mutation DeleteStudentRecord($uid: String!) @auth(level: USER, insecureReason: "Parents can delete their children's student record.") {
  student_delete(key: { uid: $uid })
}

mutation DeleteUserRecord($uid: String!) @auth(level: USER, insecureReason: "Parents can delete their children's user record.") {
  user_delete(key: { uid: $uid })
}

# ── Student Name Update (parent-side) ─────────────────────────────────────────

mutation UpdateStudentFullName($uid: String!, $fullName: String!) @auth(level: USER, insecureReason: "Parents can update their children's full name.") {
  user_update(key: { uid: $uid }, data: { fullName: $fullName })
}

# Stamps the calling student's lastActiveAt with the server time. Called on
# quiz completion so the parent's inactivity check (see GetStudentsByParent)
# can detect students who haven't studied recently.
mutation UpdateStudentLastActiveAt @auth(level: USER) {
  student_update(key: { uid_expr: "auth.uid" }, data: { lastActiveAt_expr: "request.time" })
}

# ── Parent Account Deletion ────────────────────────────────────────────────────

mutation DeleteParentRecord @auth(level: USER) {
  parent_delete(key: { uid_expr: "auth.uid" })
}

# ── Student Config ────────────────────────────────────────────────────────────

mutation UpsertStudentConfig(
  $studentUid: String!
  $usageHours: Int!
  $usageMinutes: Int!
  $cooldownHours: Int!
  $cooldownMinutes: Int!
  $quizCount: String!
) @auth(level: USER) {
  studentConfig_upsert(
    data: {
      studentUid: $studentUid
      usageHours: $usageHours
      usageMinutes: $usageMinutes
      cooldownHours: $cooldownHours
      cooldownMinutes: $cooldownMinutes
      quizCount: $quizCount
    }
  )
}

# ── Notification System ───────────────────────────────────────────────────────

mutation InsertLocalNotificationEvent(
  $fromStudentUid: String!
  $toParentUid: String!
  $eventType: String!
  $payload: String!
) @auth(level: USER, insecureReason: "Student writes events for their own parent.") {
  localNotificationEvent_insert(data: {
    fromStudentUid: $fromStudentUid
    toParentUid: $toParentUid
    eventType: $eventType
    payload: $payload
  })
}

mutation MarkLocalNotificationEventsRead(
  $eventIds: [UUID!]!
) @auth(level: USER, insecureReason: "Parent marks their own events as read; ownership enforced by prior query scoping.") {
  localNotificationEvent_updateMany(
    where: { id: { in: $eventIds } }
    data: { isRead: true }
  )
}

mutation UpsertLocalNotificationPreference(
  $userUid: String!
  $category: String!
  $enabled: Boolean!
  $reminderTime: String
) @auth(level: USER, insecureReason: "Users manage their own preferences.") {
  localNotificationPreference_upsert(data: {
    userUid: $userUid
    category: $category
    enabled: $enabled
    reminderTime: $reminderTime
  })
}

mutation DeleteLocalNotificationPreferencesForUser($userUid: String!)
@auth(level: USER, insecureReason: "Parents delete their child's data.") {
  localNotificationPreference_deleteMany(where: { userUid: { eq: $userUid } })
}
