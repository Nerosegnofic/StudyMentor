enum Role {
  Parent
  Student
}

type User @table(name: "users", key: ["uid"]) {
  uid: String! @default(expr: "auth.uid")
  email: String! @col(dataType: "varchar(255)")
  fullName: String! @col(dataType: "varchar(255)")
  role: Role!
  isActive: Boolean! @default(expr: "true")
  createdAt: Timestamp! @default(expr: "request.time")
  isEmailVerified: Boolean! @default(expr: "false")
}

type Parent @table(name: "parents", key: ["uid"]) {
  uid: String! @default(expr: "auth.uid")
  user: User!
  pinCode: String @col(dataType: "varchar(10)")
  phoneNumber: String @col(dataType: "varchar(20)")
}

type Student @table(name: "students", key: ["uid"]) {
  uid: String! @default(expr: "auth.uid")
  user: User!
  parent: Parent!
  username: String! @col(dataType: "varchar(50)") @unique
  gradeLevel: Int
  totalXp: Int @default(expr: "0")
  totalCoins: Int @default(expr: "0")
  totalQuestionsAnswered: Int @default(expr: "0")
  currentStreak: Int @default(expr: "0")
  weeklyXp: Int @default(expr: "0")
  lastActiveAt: Timestamp
}

# One row per app installed on a student's device.
type InstalledApp @table(name: "installed_apps", key: ["id"], singular: "installedApp", plural: "installedApps") {
  id: UUID! @default(expr: "uuidV4()")
  student: Student!
  studentUid: String!
  packageName: String! @col(dataType: "varchar(255)")
  appLabel: String! @col(dataType: "varchar(255)")
  isSystemApp: Boolean! @default(expr: "false")
}

# One row per configured app per student.
type AppRule @table(name: "app_rules", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  student: Student!
  studentUid: String!
  packageName: String! @col(dataType: "varchar(255)")
  appLabel: String! @col(dataType: "varchar(255)")
}

# One row per student holding the global usage and cooldown time limits.
type StudentConfig @table(name: "student_configs", key: ["studentUid"]) {
  studentUid: String!
  student: Student!
  usageHours: Int! @default(expr: "0")
  usageMinutes: Int! @default(expr: "30")
  cooldownHours: Int! @default(expr: "0")
  cooldownMinutes: Int! @default(expr: "10")
}

# Per-student app preferences (notifications, sounds, music).
type StudentSettings @table(name: "student_settings", key: ["studentUid"]) {
  studentUid: String!
  student: Student!
  notificationsEnabled: Boolean! @default(expr: "true")
  soundEffectsEnabled: Boolean! @default(expr: "true")
  backgroundMusicEnabled: Boolean! @default(expr: "false")
}

# Support tickets submitted from the Help Center.
type SupportTicket @table(name: "support_tickets", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  userId: String! @col(dataType: "varchar(128)")
  userName: String! @col(dataType: "varchar(255)")
  issueType: String! @col(dataType: "varchar(100)")
  message: String! @col(dataType: "text")
  status: String! @col(dataType: "varchar(20)") @default(expr: "'open'")
  createdAt: Timestamp! @default(expr: "request.time")
}

# Records a shop item purchased by a student.
type StudentOwnedItem @table(name: "student_owned_items", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  student: Student!
  studentUid: String!
  itemId: String! @col(dataType: "varchar(50)")
  purchasedAt: Timestamp! @default(expr: "request.time")
}

# ── Garden System ─────────────────────────────────────────────────────────────

type SubjectProgress @table(name: "subject_progress", key: ["studentUid", "subjectKey"]) {
  studentUid: String!
  student: Student!
  subjectKey: String! @col(dataType: "varchar(50)")
  totalXp: Int! @default(expr: "0")
  level: Int! @default(expr: "1")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Stores the student's current avatar configuration.
type StudentAvatar @table(name: "student_avatars", key: ["studentUid"]) {
  studentUid: String!
  student: Student!
  gender: String! @col(dataType: "varchar(10)") @default(expr: "'male'")
  skinTone: String! @col(dataType: "varchar(20)") @default(expr: "'medium'")
  equippedHair: String @col(dataType: "varchar(50)")
  equippedOutfit: String @col(dataType: "varchar(50)")
  equippedBottom: String @col(dataType: "varchar(50)")
  equippedShoes: String @col(dataType: "varchar(50)")
  equippedAccessory: String @col(dataType: "varchar(50)")
  equippedBackground: String @col(dataType: "varchar(50)")
  equippedSpecial: String @col(dataType: "varchar(50)")
}
