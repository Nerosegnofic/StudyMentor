enum Role {
  Parent
  Student
}

type User @table(name: "users", key: ["uid"]) {
  uid: String! @default(expr: "auth.uid")
  email: String! @col(dataType: "varchar(255)")
  fullName: String! @col(dataType: "varchar(255)")
  role: Role!
  isActive: Boolean! @default(expr: "true")
  createdAt: Timestamp! @default(expr: "request.time")
  isEmailVerified: Boolean! @default(expr: "false")
}

type Parent @table(name: "parents", key: ["uid"]) {
  uid: String! @default(expr: "auth.uid")
  user: User!
  pinCode: String @col(dataType: "varchar(10)")
  phoneNumber: String @col(dataType: "varchar(20)")
}

type Student @table(name: "students", key: ["uid"]) {
  uid: String! @default(expr: "auth.uid")
  user: User!
  parent: Parent!
  friendCode: String @col(dataType: "varchar(20)")
  gradeLevel: Int
  totalXp: Int @default(expr: "0")
  totalCoins: Int @default(expr: "0")
}

# One row per app installed on a student's device.
# Populated by the student device on login and whenever a package is installed
# or removed (via PackageChangedReceiver → dirty-flag → next resume sync).
# The parent's app-picker reads this table instead of a hardcoded mock list.
type InstalledApp @table(name: "installed_apps", key: ["id"], singular: "installedApp", plural: "installedApps") {
  id: UUID! @default(expr: "uuidV4()")
  student: Student!
  studentUid: String!
  packageName: String! @col(dataType: "varchar(255)")
  appLabel: String! @col(dataType: "varchar(255)")
  isSystemApp: Boolean! @default(expr: "false")
  iconBase64: String @col(dataType: "text")
}

# One row per configured app per student.
# packageName is the Android package identifier (e.g. "com.google.android.youtube").
# Time limits are applied globally via StudentConfig — not per app.
type AppRule @table(name: "app_rules", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  student: Student!
  studentUid: String!
  packageName: String! @col(dataType: "varchar(255)")
  appLabel: String! @col(dataType: "varchar(255)")
  iconBase64: String @col(dataType: "text")
}

# One row per student holding the global usage and cooldown time limits.
# These limits apply to ALL restricted apps configured for the student.
# usageHours / usageMinutes: total time the student may use any restricted app per session.
# cooldownHours / cooldownMinutes: time the student must wait after the session ends.
type StudentConfig @table(name: "student_configs", key: ["studentUid"]) {
  studentUid: String!
  student: Student!
  usageHours: Int! @default(expr: "0")
  usageMinutes: Int! @default(expr: "30")
  cooldownHours: Int! @default(expr: "0")
  cooldownMinutes: Int! @default(expr: "10")
}