  <path fill="#3aaa3a" stroke="#1f6b1f" stroke-width="1.5" d="&#10;    M340 318&#10;    C354 308 376 294 394 278&#10;    C412 261 418 240 408 224&#10;    C398 208 378 206 360 216&#10;    C344 226 334 248 334 270&#10;    C334 290 336 308 340 318 Z" style="fill:rgb(58, 170, 58);stroke:rgb(31, 107, 31);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <path d="M340 318 C358 290 386 258 405 228" style="fill:none;stroke:rgb(26, 80, 16);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <path d="M354 306 C364 284 376 266 388 248" style="fill:none;stroke:rgb(26, 80, 16);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

